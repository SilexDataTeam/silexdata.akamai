---
# Check-mode tests for manage_akamai.
#
# These are written assuming the module supports check mode: every method must
# run in check mode, send nothing, and report a change only for the methods
# that write. They are intentionally NOT conditional on the module's current
# check-mode support -- if the module does not declare supports_check_mode,
# Ansible skips it and these assertions fail by design, surfacing the missing
# check-mode support. Without a live service, a request that was sent anyway
# fails to connect, so "not failed" also shows that nothing was sent.

- name: Check-mode | Run each read-only method in check mode
  silexdata.akamai.manage_akamai:
    method: "{{ manage_akamai_check_mode_method }}"
    endpoint: "{{ manage_akamai_endpoint }}"
    edge_auth: "{{ manage_akamai_edge_auth }}"
  check_mode: true
  register: manage_akamai_check_mode_read
  ignore_errors: true
  loop: [GET, HEAD]
  loop_control:
    loop_var: manage_akamai_check_mode_method

- name: Check-mode | Assert read-only methods ran in check mode and reported no change
  ansible.builtin.assert:
    that:
      - manage_akamai_check_mode_read.results | select('skipped') | list | length == 0
      - manage_akamai_check_mode_read.results | select('failed') | list | length == 0
      - manage_akamai_check_mode_read.results | select('changed') | list | length == 0
    fail_msg: >-
      Module did not run correctly in check mode. The module must declare
      supports_check_mode=True, send nothing, and report no change for GET and HEAD.
    success_msg: "Module supports check mode and reported no change for read-only methods."

- name: Check-mode | Run each write method in check mode
  silexdata.akamai.manage_akamai:
    method: "{{ manage_akamai_check_mode_method }}"
    endpoint: "{{ manage_akamai_endpoint }}"
    body:
      comment: check mode
    edge_auth: "{{ manage_akamai_edge_auth }}"
  check_mode: true
  register: manage_akamai_check_mode_write
  ignore_errors: true
  loop: [POST, PUT, PATCH, DELETE]
  loop_control:
    loop_var: manage_akamai_check_mode_method

- name: Check-mode | Assert write methods ran in check mode and predicted a change without sending anything
  ansible.builtin.assert:
    that:
      - manage_akamai_check_mode_write.results | select('skipped') | list | length == 0
      - manage_akamai_check_mode_write.results | select('failed') | list | length == 0
      - manage_akamai_check_mode_write.results | select('changed') | list | length == 4
      - manage_akamai_check_mode_write.results | map(attribute='msg') | unique | list == [{}]
    fail_msg: >-
      Module did not run correctly in check mode. Each write method must run
      without sending a request and report a predicted change.
    success_msg: "Module supports check mode and predicted a change for each write method."

- name: Check-mode | Create a JSON body file
  ansible.builtin.tempfile:
    suffix: .json
  register: manage_akamai_check_mode_body_file

- name: Check-mode | Send a body file through src
  block:
    - name: Check-mode | Write the body file
      ansible.builtin.copy:
        content: '{"zone": "example.org"}'
        dest: "{{ manage_akamai_check_mode_body_file.path }}"
        mode: "0600"

    - name: Check-mode | POST the file with src
      silexdata.akamai.manage_akamai:
        method: POST
        endpoint: "{{ manage_akamai_endpoint }}"
        src: "{{ manage_akamai_check_mode_body_file.path }}"
        edge_auth: "{{ manage_akamai_edge_auth }}"
      check_mode: true
      register: manage_akamai_check_mode_src

    - name: Check-mode | Assert the src file was read and a change predicted
      ansible.builtin.assert:
        that:
          - manage_akamai_check_mode_src is changed
          - manage_akamai_check_mode_src.deprecations | default([]) | length == 0
        fail_msg: "Unexpected result for a src file: {{ manage_akamai_check_mode_src }}"
        success_msg: "A body file sent through src works in check mode."
  always:
    - name: Check-mode | Remove the body file
      ansible.builtin.file:
        path: "{{ manage_akamai_check_mode_body_file.path }}"
        state: absent
