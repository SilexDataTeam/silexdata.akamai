---
# Validation that happens before any request is sent, so these run without a
# live service. Each checks the message, so failing to connect is not a pass.

- name: Expected-failures | Fails without a zone
  silexdata.akamai.edge_dns_zone:
    edge_auth: "{{ edge_dns_zone_edge_auth }}"
  register: edge_dns_zone_missing_zone
  ignore_errors: true

- name: Expected-failures | Fails on a type outside its choices
  silexdata.akamai.edge_dns_zone:
    zone: example.org
    type: FORWARD
    edge_auth: "{{ edge_dns_zone_edge_auth }}"
  register: edge_dns_zone_bad_type
  ignore_errors: true

- name: Expected-failures | Fails on a secondary zone without masters
  silexdata.akamai.edge_dns_zone:
    zone: example.org
    type: SECONDARY
    edge_auth: "{{ edge_dns_zone_edge_auth }}"
  register: edge_dns_zone_no_masters
  ignore_errors: true

- name: Expected-failures | Fails on an alias zone without a target
  silexdata.akamai.edge_dns_zone:
    zone: example.org
    type: ALIAS
    edge_auth: "{{ edge_dns_zone_edge_auth }}"
  register: edge_dns_zone_no_target
  ignore_errors: true

- name: Expected-failures | Fails on a Sign&Serve algorithm outside its choices
  silexdata.akamai.edge_dns_zone:
    zone: example.org
    sign_and_serve_algorithm: MD5
    edge_auth: "{{ edge_dns_zone_edge_auth }}"
  register: edge_dns_zone_bad_algorithm
  ignore_errors: true

- name: Expected-failures | Fails on a negative retry count
  silexdata.akamai.edge_dns_zone:
    zone: example.org
    max_retries: -1
    edge_auth: "{{ edge_dns_zone_edge_auth }}"
  register: edge_dns_zone_negative_retries
  ignore_errors: true

- name: Expected-failures | Assert each invalid call was rejected before any request
  ansible.builtin.assert:
    that:
      - edge_dns_zone_missing_zone is failed
      - "'missing required arguments: zone' in edge_dns_zone_missing_zone.msg"
      - edge_dns_zone_bad_type is failed
      - "'value of type must be one of' in edge_dns_zone_bad_type.msg"
      - edge_dns_zone_no_masters is failed
      - "'type is SECONDARY but all of the following are missing: masters' in edge_dns_zone_no_masters.msg"
      - edge_dns_zone_no_target is failed
      - "'type is ALIAS but all of the following are missing: target' in edge_dns_zone_no_target.msg"
      - edge_dns_zone_bad_algorithm is failed
      - "'value of sign_and_serve_algorithm must be one of' in edge_dns_zone_bad_algorithm.msg"
      - edge_dns_zone_negative_retries is failed
      - "'max_retries must not be negative' in edge_dns_zone_negative_retries.msg"
    fail_msg: >-
      An invalid call was not rejected as expected:
      {{ [edge_dns_zone_missing_zone, edge_dns_zone_bad_type, edge_dns_zone_no_masters, edge_dns_zone_no_target,
          edge_dns_zone_bad_algorithm, edge_dns_zone_negative_retries]
         | map(attribute='msg') | list }}
    success_msg: "Each invalid call was rejected before any request was sent."
