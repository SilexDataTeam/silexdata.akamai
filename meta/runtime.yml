---
requires_ansible: '>=2.14.0'

plugin_routing:
  modules:
    akamai:
      # removal_date rather than removal_version: ansible-test rejects a
      # tombstone removal_version later than galaxy.yml's version, which the
      # release workflow only bumps to 2.0.0 after this merges.
      tombstone:
        removal_date: '2026-10-02'
        warning_text: >-
          The silexdata.akamai.akamai module was renamed to
          silexdata.akamai.manage_akamai in 1.1.0, and the old name was removed
          in 2.0.0. Use silexdata.akamai.manage_akamai.
