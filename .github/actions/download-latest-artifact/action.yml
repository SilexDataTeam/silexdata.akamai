---
name: Download latest workflow artifact
description: >-
  Downloads a named artifact from the latest successful run of another
  workflow on a given branch, for stitching artifacts together across
  independent workflows (e.g. combining a docs site and a coverage report
  into one GitHub Pages deployment).
inputs:
  workflow:
    description: Workflow file name to search (e.g. coverage.yml).
    required: true
  branch:
    description: Branch to search for successful runs.
    required: true
    default: main
  artifact-name:
    description: Name of the artifact to download.
    required: true
  path:
    description: Destination directory for the downloaded artifact.
    required: true
  github-token:
    description: Token used to query the Actions API and download the artifact.
    required: true
runs:
  using: composite
  steps:
    - name: Find latest successful run of ${{ inputs.workflow }}
      id: find_run
      uses: actions/github-script@v7
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const { data } = await github.rest.actions.listWorkflowRuns({
            owner: context.repo.owner,
            repo: context.repo.repo,
            workflow_id: "${{ inputs.workflow }}",
            branch: "${{ inputs.branch }}",
            status: "success",
            per_page: 1,
          });
          if (data.workflow_runs.length === 0) {
            core.setFailed(
              `No successful run of ${{ inputs.workflow }} found on ${{ inputs.branch }}.`
            );
            return;
          }
          core.setOutput("run_id", data.workflow_runs[0].id);

    - name: Download ${{ inputs.artifact-name }}
      uses: actions/download-artifact@v8
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ inputs.path }}
        github-token: ${{ inputs.github-token }}
        run-id: ${{ steps.find_run.outputs.run_id }}
