# SPDX-License-Identifier: Apache-2.0
name: Changelog

# Thin caller - see reusable-changelog.yml in the collection_skeleton repo.
on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: changelog-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changelog:
    # No-op in every generated collection repo; skips only in the
    # collection_skeleton template itself, which has no root galaxy.yml
    # for the reusable workflow's detect job to read.
    if: github.repository != 'SilexDataTeam/silexdata.collection_skeleton'
    uses: SilexDataTeam/silexdata.collection_skeleton/.github/workflows/reusable-changelog.yml@v1
