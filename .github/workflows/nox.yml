name: Nox

# Thin caller - see reusable-nox.yml in the collection_skeleton repo.
# min-ansible-core is derived from this collection's meta/runtime.yml, so
# nothing needs passing here.
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nox:
    # No-op in every generated collection repo; skips only in the
    # collection_skeleton template itself, which has no root galaxy.yml
    # for the reusable workflow's detect job to read.
    if: github.repository != 'SilexDataTeam/silexdata.collection_skeleton'
    uses: SilexDataTeam/silexdata.collection_skeleton/.github/workflows/reusable-nox.yml@v1
