name: Docs

# Thin caller - see reusable-docs.yml in the collection_skeleton repo.
# Builds the antsibull-docs site and deploys it, plus the coverage report,
# to GitHub Pages on pushes to main.
on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    # No-op in every generated collection repo; skips only in the
    # collection_skeleton template itself, which has no root galaxy.yml
    # for the reusable workflow's detect job to read.
    if: github.repository != 'SilexDataTeam/silexdata.collection_skeleton'
    uses: SilexDataTeam/silexdata.collection_skeleton/.github/workflows/reusable-docs.yml@v1
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
