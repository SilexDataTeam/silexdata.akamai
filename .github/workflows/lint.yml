name: Lint

# Thin caller. All logic lives in the collection_skeleton repo, which is the
# single source of truth for collection CI; update it there and bump the pin
# here (Dependabot does this automatically).
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    # No-op in every generated collection repo; skips only in the
    # collection_skeleton template itself, which has no root galaxy.yml
    # for the reusable workflow's detect job to read.
    if: github.repository != 'SilexDataTeam/silexdata.collection_skeleton'
    uses: SilexDataTeam/silexdata.collection_skeleton/.github/workflows/reusable-lint.yml@v1
