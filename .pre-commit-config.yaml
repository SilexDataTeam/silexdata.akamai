---
# Pre-commit hooks for the silexdata.akamai collection.
#
# Setup (one time, per clone):
#   pip install pre-commit
#   pre-commit install
#
# Run against everything on demand:
#   pre-commit run --all-files
#
# Refresh hook versions:
#   pre-commit autoupdate
#
# These hooks cover lint/format/hygiene only. The heavier ansible-test suites
# (sanity / units / integration) run in GitHub Actions, not as pre-commit hooks.

minimum_pre_commit_version: "3.0.0"

repos:
  # General file hygiene.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: ["--fix=lf"]
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-added-large-files
      - id: check-yaml
        # Allow custom tags occasionally used in Ansible/Galaxy YAML.
        args: ["--allow-multiple-documents"]
        exclude: ^changelogs/changelog\.yaml$

  # Python lint + format + import sorting (replaces flake8/black/isort).
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.18
    hooks:
      - id: ruff-check
        args: ["--fix"]
      - id: ruff-format

  # YAML linting.
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        args: ["--strict"]

  # Markdown linting (pure-Python, no Node dependency).
  - repo: https://github.com/jackdewinter/pymarkdown
    rev: v0.9.38
    hooks:
      - id: pymarkdown
        args: ["--config", ".pymarkdown.json", "scan"]
        # CHANGELOG.md is generated by antsibull-changelog from changelog.yaml.
        exclude: ^CHANGELOG\.md$

  # Ansible content linting.
  - repo: https://github.com/ansible/ansible-lint
    rev: v26.4.0
    hooks:
      - id: ansible-lint

  # Changelog fragment + changelog.yaml linting.
  - repo: https://github.com/ansible-community/antsibull-changelog
    rev: 0.35.1
    hooks:
      - id: antsibull-changelog-lint
      - id: antsibull-changelog-lint-changelog-yaml

  # GitHub Actions workflow syntax + expression validation - catches things
  # like referencing a context (e.g. needs) where it isn't available, or an
  # action input that doesn't exist, before a run wastes CI time discovering
  # it (or, for a startup-time syntax error, before the run doesn't happen
  # at all).
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  # Collection documentation linting: validates plugin DOCUMENTATION/EXAMPLES/
  # RETURN schemas and extra docsite RST refs without doing a full Sphinx
  # build. Mirrors the command the docs-check nox session runs (see
  # antsibull-nox.toml), so failures here match what `nox -e docs-check` and
  # CI would report. antsibull-docs has no official pre-commit mirror, so
  # this runs it as a local hook. Uses a floor pin (unlike the rev-pinned
  # hooks above) to match docs.yml's unpinned `pip install antsibull-docs`
  # while still guaranteeing at least the version this config was verified
  # against. Note pre-commit only re-resolves the dependency when it
  # (re)builds the hook's cached environment - e.g. after `pre-commit clean`
  # or a cache eviction - not on every run, so a local run can still lag
  # behind CI between those.
  - repo: local
    hooks:
      - id: antsibull-docs-lint
        name: antsibull-docs lint-collection-docs
        entry: antsibull-docs lint-collection-docs --plugin-docs --skip-rstcheck --check-extra-docs-refs .
        language: python
        additional_dependencies: ["antsibull-docs>=2.26.0"]
        pass_filenames: false
        files: ^(plugins/|docs/docsite/|galaxy\.yml$|meta/runtime\.yml$)

  # Collection build + Galaxy importer check: builds the collection into a
  # tarball and runs it through galaxy-importer's static checks (doc
  # parsing, ansible-lint, runtime.yml/ignore-file sanity) the way Galaxy
  # itself would on publish. Fully offline despite the name - no live Galaxy
  # API call. Unlike the docs-check hook above, this one is driven through
  # `nox -e build-import-check` itself rather than a mirrored raw command,
  # since the underlying check is a multi-step build-then-import sequence
  # (see antsibull-nox.toml) that's simpler to delegate to nox than to
  # reimplement here. `-R` reuses nox's own cached session environment
  # (typically ~6-7s) instead of reinstalling ansible-core/galaxy-importer on
  # every commit (~17s cold); run `nox -e build-import-check` without `-R`,
  # or clear the `.nox/build-import-check` directory, to force a refresh.
  - repo: local
    hooks:
      - id: nox-build-import-check
        name: nox build-import-check
        entry: nox -R -e build-import-check
        language: python
        additional_dependencies: ["nox", "antsibull-nox"]
        pass_filenames: false
